services:

  # The browser-facing entry point: the client at / and the server's API at /api, on one
  # origin (http://localhost:8080), so the client's own API calls are never cross-origin.
  proxy:
    build: ./proxy
    restart: always
    ports:
      - 8080:80
    depends_on:
      - server
      - client

  server:
    image: {SERVER_IMAGE}
    restart: always
    ports:
      - 3000:3000
    volumes:
      - ./server/application.yml:/app/config/application.yml:ro
    depends_on:
      - garage
      - postgres

  # No API_URL: the client defaults to <its own origin>/api, which the proxy serves.
  client:
    image: {CLIENT_IMAGE}
    restart: always

  document-worker:
    image: {DOCUMENT_WORKER_IMAGE}
    restart: always
    volumes:
      - ./document-worker/config.yml:/app/config/application.yml:ro
    depends_on:
      - garage
      - postgres

  postgres:
    image: postgres:15.2
    container_name: postgres
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dsw
    volumes:
      - ./scripts/patch-db.sql:/scripts/patch-db.sql:ro

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: garage
    restart: always
    ports:
      - 3900:3900
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro

  # Fixed /search dataset for the KM editor's integration test call and the
  # questionnaire's type hints (server.httpClient.restricted.allowedHosts allows it).
  mockserver:
    build: ./mockserver
    restart: always
