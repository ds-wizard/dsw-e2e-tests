# proxy_pass doesn't forward the websocket handshake on its own, $connection_upgrade
# falls back to "close" for plain HTTP requests on the same location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    location /api {
        proxy_pass http://server:3000;
        proxy_set_header Host $http_host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # The client is a single-page app, its own nginx does the index.html fallback.
    location / {
        proxy_pass http://client:8080;
    }

    access_log off;
    error_log /var/log/nginx/error.log error;
}
